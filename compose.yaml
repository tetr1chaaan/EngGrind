services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: enggrind
      POSTGRES_USER: enggrind
      POSTGRES_PASSWORD: enggrind
    ports:
      - "5432:5432"
    volumes:
      - enggrind-postgres:/var/lib/postgresql/data

volumes:
  enggrind-postgres:
